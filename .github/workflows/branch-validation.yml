name: Branch Validation

on:
  pull_request:
    branches:
      - development
      - main

jobs:
  validate-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Validate Branch Flow
        run: |
          BRANCH="${{ github.head_ref }}"
          TARGET="${{ github.base_ref }}"

          echo "Source: $BRANCH"
          echo "Target: $TARGET"

          # development -> main
          [[ "$BRANCH" == "development" && "$TARGET" == "main" ]] && exit 0

          # main -> development (back-merge)
          [[ "$BRANCH" == "main" && "$TARGET" == "development" ]] && exit 0

          # feature/* -> development
          [[ "$BRANCH" =~ ^feature\/.+$ && "$TARGET" == "development" ]] && exit 0

          # bug/* -> development
          [[ "$BRANCH" =~ ^bug\/.+$ && "$TARGET" == "development" ]] && exit 0

          # hotfix/* -> main
          [[ "$BRANCH" =~ ^hotfix\/.+$ && "$TARGET" == "main" ]] && exit 0

          # hotfix/* -> development (back-merge)
          [[ "$BRANCH" =~ ^hotfix\/.+$ && "$TARGET" == "development" ]] && exit 0

          # release/* -> main
          [[ "$BRANCH" =~ ^release\/.+$ && "$TARGET" == "main" ]] && exit 0

          # release/* -> development (back-merge)
          [[ "$BRANCH" =~ ^release\/.+$ && "$TARGET" == "development" ]] && exit 0

          echo "❌ Invalid branch flow: '$BRANCH' -> '$TARGET'"
          echo "Allowed flows:"
          echo "  feature/*  -> development"
          echo "  bug/*      -> development"
          echo "  hotfix/*   -> main | development"
          echo "  release/*  -> main | development"
          echo "  development -> main"
          exit 1
