name: Backend Build

on:
  pull_request:
    branches:
      - development
      - main
    paths:
      - 'platform/**'
      - '!platform/frontend/**'

jobs:
  backend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: platform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build all modules
        run: mvn clean package -DskipTests

      - name: Test all modules
        run: mvn test
        env:
          SPRING_PROFILES_ACTIVE: local
          JWT_SECRET: platform-super-secret-key-must-be-at-least-256-bits-long-for-hs256
