spring:
  application:
    name: platform

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

platform:
  jwt:
    secret: ${JWT_SECRET:platform-secret-key-must-be-at-least-256-bits-long-change-in-prod}
    access-token-ms: ${JWT_ACCESS_MS:86400000}
    refresh-token-ms: ${JWT_REFRESH_MS:604800000}
  storage:
    local:
      base-path: ${STORAGE_PATH:./uploads}
  pagination:
    default-size: 20
    max-size: 100

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
