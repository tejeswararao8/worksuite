spring:
  datasource:
    url: jdbc:h2:mem:platformdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  # Disable OAuth2 resource server for local — no Keycloak needed
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

  # Use simple (in-memory) cache instead of Redis
  cache:
    type: simple

  # Disable RabbitMQ auto-connect
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        auto-startup: false

  # Disable MongoDB auto-connect
  data:
    mongodb:
      uri: mongodb://localhost:27017/platform_local
      auto-index-creation: false

  # Disable Redis auto-connect
  redis:
    host: localhost
    port: 6379

logging:
  level:
    com.platform: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
