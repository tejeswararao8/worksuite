spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:vvesolutions_db}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:vveadmin}
    password: ${DB_PASSWORD:vve@admin123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    mongodb:
      uri: mongodb://localhost:27017/company_chat_db

  redis:
    host: localhost
    port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/vve-platform

  flyway:
    enabled: false

  cache:
    type: redis

keycloak:
  auth-server-url: http://localhost:8080
  realm: vve-platform
  admin:
    client-id: admin-cli
    username: admin
    password: admin123

opensearch:
  host: localhost
  port: 9200
  scheme: http

platform:
  storage:
    minio:
      endpoint: http://localhost:9000
      access-key: admin
      secret-key: admin123456
      bucket: vve-documents
  logging:
    slow-threshold-ms: 500

logging:
  level:
    com.platform: DEBUG
    org.springframework.security: WARN
