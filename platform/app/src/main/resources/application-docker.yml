spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/vvesolutions_db
    driver-class-name: org.postgresql.Driver
    username: vveadmin
    password: vve@admin123

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  data:
    mongodb:
      uri: mongodb://localhost:27017/company_chat_db

  redis:
    host: localhost
    port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/vve-platform

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

keycloak:
  auth-server-url: http://localhost:8080
  realm: vve-platform
  admin:
    client-id: admin-cli
    username: admin
    password: admin123

opensearch:
  host: localhost
  port: 9200
  scheme: http

platform:
  storage:
    minio:
      endpoint: http://localhost:9000
      access-key: admin
      secret-key: admin123456
      bucket: vve-documents
  logging:
    slow-threshold-ms: 500

logging:
  level:
    com.platform: DEBUG
